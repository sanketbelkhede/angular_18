<div class="mt-2 p-2 bg-success text-white rounded">
  <h4>Post API, Update & Delete</h4>
  <h3>Create Department, Department List</h3>
</div>

<app-alert [message]="'Welcome To POST Page'" [alertType]="'Success'"></app-alert>
<app-alert [message]="'Some Error Occured'" [alertType]="'Error'"></app-alert>
<app-my-button (onBtnClick)="getData($event)" [btnClass]="'btn-success'" [btnText]="'Get Data'"></app-my-button>
<div class="row pt-2">
  <div class="col-8">
    <div class="card">
      <div class="card-header bg-secondary text-white">
        Department List
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-12">
            <table class="table table-bordered">
              <thead>
              <tr>
                <th>Sr No</th>
                <th>Name</th>
                <th>Logo</th>
                <th>Action</th>
              </tr>
              </thead>
              <tbody>
              @for (item of departmentList; track $index) {
                <tr>
                  <td>{{$index + 1}}</td>
                  <td>{{item.departmentName}}</td>
                  <td>{{item.departmentLogo}}</td>
                  <td>
<!--                    <button class="btn btn-primary" (click)="onEdit(item)">Edit</button>-->
                    <app-my-button (onBtnClick)="onEdit(item)" [btnClass]="'btn-primary'" [btnText]="'Edit'"></app-my-button>
                    <app-my-button (onBtnClick)="onDelete($index)" [btnClass]="'btn-danger mx-2'" [btnText]="'Delete'"></app-my-button>
<!--                    <button class="btn btn-danger mx-2" (click)="onDelete(item.departmentId)">Delete</button>-->
                  </td>
                </tr>
              }
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-4">
    <div class="card">
      <div class="card-header bg-secondary text-white">
        New Department
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-12">
            <label>Department Name</label>
            <input type="text" [(ngModel)]="departmentObj.departmentName" class="form-control" placeholder="Enter Name">
          </div>
          <div class="col-12">
            <label>Department Logo</label>
            <input type="text" [(ngModel)]="departmentObj.departmentLogo" class="form-control" placeholder="Enter Logo Url">
          </div>
          <div class="row pt-3">
            <div class="col-6 text-center">
              <button class="btn btn-secondary" (click)="reset()">Reset</button>
            </div>
            <div class="col-6 text-center">
              @if (departmentObj.departmentId == "") {
<!--                <button class="btn btn-success" (click)="onSave()">Save</button>-->
                <app-my-button (onBtnClick)="onSave()" [disabled]="(departmentObj.departmentName == '' || departmentObj.departmentLogo == '')" [btnClass]="'btn-success'" [btnText]="'Save'"></app-my-button>
              } @else {
<!--                <button class="btn btn-warning" (click)="onUpdate()">Update</button>-->
                <app-my-button (onBtnClick)="onUpdate()" [disabled]="(departmentObj.departmentName == '' || departmentObj.departmentLogo == '')" [btnClass]="'btn-warning'" [btnText]="'Update'"></app-my-button>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
