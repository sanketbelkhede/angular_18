<div class="mt-2 p-2 bg-secondary text-white rounded">
  <h1>ng-container</h1>
</div>
<div class="row pt-3">
  <div class="col-4">
    <ng-container *ngIf="isContainer">
      <p>This is from ng-container</p>
    </ng-container>
  </div>
  <div class="col-4">
    <button class="btn btn-primary" (click)="getAllUsers()">Get Users</button>
  </div>
  <div class="col-4">
    <ng-container *ngTemplateOutlet=mytemp>

    </ng-container>
  </div>
</div>
<div class="row pt-3">
  <div class="col-12">
    <ng-container>
      <table class="table table-bordered">
        <thead>
        <tr>
          <th>Sr No</th>
          <th>Name</th>
          <th>Email</th>
          <th>Username</th>
          <th>Phone</th>
        </tr>
        </thead>
        <tbody>
        <ng-container *ngIf="isLoader">
          <tr>
            <td colspan="5" class="text-center">
              <div class="spinner-border text-muted"></div>
              <div class="spinner-border text-primary"></div>
              <div class="spinner-border text-success"></div>
              <div class="spinner-border text-info"></div>
              <div class="spinner-border text-warning"></div>
              <div class="spinner-border text-danger"></div>
              <div class="spinner-border text-secondary"></div>
              <div class="spinner-border text-dark"></div>
              <div class="spinner-border text-light"></div>
            </td>
          </tr>
        </ng-container>
        <ng-container *ngIf="!isLoader">
          <tr *ngFor="let item of userList; let i=index">
            <td>{{i + 1}}</td>
            <td>{{item.name}}</td>
            <td>{{item.email}}</td>
            <td>{{item.username}}</td>
            <td>{{item.phone}}</td>
          </tr>
        </ng-container>
        </tbody>
      </table>
    </ng-container>
  </div>
</div>
<ng-template #mytemp>
  <p>Hi from Template</p>
</ng-template>
