<div class="mt-2 p-2 bg-secondary text-white rounded">
  <h1>ng-template</h1>
</div>
<div class="row pt-3">
  <div class="col-3">
    <div class="bg-primary p-3 text-white" *ngIf="isUserLoggedIn; else notLoggedIn">
      {{ loggedInUserName }}
    </div>
    <ng-template #notLoggedIn>
      <div class="bg-danger p-3 text-white">
        <span>User Not Logged In</span>
      </div>
    </ng-template>
  </div>
  <div class="col-4">
    <ng-template #dynamicTemp>
      <p>Hi From Dynamic Template</p>
    </ng-template>
  </div>
  <div class="col-4">
    <div #dynamicContainer>
    </div>
  </div>
</div>
<div class="row pt-3">
  <div class="col-3 text-center">
    <button class="btn btn-success mx-2" (click)="show()">Show</button>
    <button class="btn btn-danger" (click)="hide()">Hide</button>
  </div>
  <div class="col-3 text-center">

  </div>
  <div class="col-3 text-center">
    <button class="btn btn-danger" (click)="loadTemplate()">Load Content</button>
  </div>
</div>
