<div class="parent">
  <div class="login-container">
    <div class="signin-form">
      <h2>Sign In</h2>
      <form>
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" [(ngModel)]="userObj.userName" name="username" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="userObj.password" name="password" required>
        </div>
        <button type="button" (click)="onLogin()">Sign In</button>
      </form>
    </div>
  </div>
</div>
